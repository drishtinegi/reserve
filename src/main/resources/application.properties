# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── Neon PostgreSQL Database ──────────────────────────────────────────────────
# On Railway, set these as environment variables (RAILWAY will auto-inject them).
# For local dev, replace the placeholder values below with your real Neon details.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/reserve}
spring.datasource.username=${JDBC_DATABASE_USERNAME:postgres}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:your_password_here}

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate: Hibernate checks that DB tables match entities but never changes them.
# Flyway owns all schema changes instead.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Disable open-in-view to prevent unnecessary DB queries during response rendering
spring.jpa.open-in-view=false

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── JWT ───────────────────────────────────────────────────────────────────────
# Access token: short-lived — 15 minutes (900,000 ms)
jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-32chars!!}
jwt.expiration-ms=900000

# Refresh token: long-lived — 7 days
jwt.refresh-expiration-days=7

# ── Springdoc / Swagger ───────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
